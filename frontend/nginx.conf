server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: semua route non-file diarahkan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend (nama service 'api' di docker-compose).
    # Frontend memanggil /api/... secara relative, jadi tidak ada masalah CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache aset build (hash di nama file oleh Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
